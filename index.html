<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時語音轉文字 | Live Speech Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>即時語音轉換</h1>
            <p class="subtitle">支援中文與英文即時辨識</p>
        </header>

        <div class="controls-card">
            <div class="setting-group">
                <label for="languageSelect">選擇辨識語言：</label>
                <div class="select-wrapper">
                    <select id="languageSelect">
                        <option value="zh-TW">繁體中文 (國語)</option>
                        <option value="en-US">English (英文)</option>
                    </select>
                </div>
            </div>

            <div class="status-indicator" id="statusIndicator">
                <span class="dot"></span>
                <span class="status-text" id="statusText">系統就緒，點擊下方按鈕開始</span>
            </div>

            <button id="recordBtn" class="record-btn">
                <div class="btn-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>
                </div>
                <span id="btnText">開始錄音</span>
            </button>
        </div>

        <div class="transcript-card">
            <div class="transcript-header">
                <h2>辨識結果</h2>
                <div class="header-actions">
                    <a id="downloadAudioBtn" class="primary-btn download-btn" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" x2="12" y1="15" y2="3"></line></svg>
                        下載音檔
                    </a>
                    <button id="downloadWordBtn" class="primary-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" x2="8" y1="13" y2="13"></line><line x1="16" x2="8" y1="17" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        存成 Word
                    </button>
                    <button id="copyBtn" class="secondary-btn" title="複製全部文字">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
                        複製
                    </button>
                    <button id="clearBtn" class="secondary-btn" title="清除畫面">清除</button>
                </div>
            </div>
            <div class="transcript-box" id="transcriptBox">
                <div class="placeholder-text" id="placeholderText">語音文字將顯示在這裡...</div>
                <div class="text-content" id="textContent">
                    <!-- 最終確定的文字 -->
                    <span id="finalText" class="final-text"></span>
                    <!-- 正在辨識中的文字（即時變化） -->
                    <span id="interimText" class="interim-text"></span>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
